name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: badminton_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d badminton_booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/badminton_booking_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/badminton_booking_test
      DATABASE_SSL: "false"
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGINS: http://127.0.0.1:5173
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Create development guard database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE badminton_booking_dev"
      - run: npm run typecheck:server
      - run: npm run test:server
      - run: npm run build:server
